# Logseq-related text expansions.
#
# @author Quinn McHugh
# @website https://quinnmchugh.net

matches:
  - label: ""
    trigger: "warning" 
    replace: "⚠️ **WARNING** - "
    propagate_case: true
    word: true
    
  - label: ""
    trigger: "DONT DO" 
    replace: "# 🙅 NOT TO DO"
    propagate_case: true
    word: true