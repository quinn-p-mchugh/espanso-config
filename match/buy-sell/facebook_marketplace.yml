# Text expansions for selling things on Facebook Marketplace.

# @author Quinn McHugh
# @website https://quinnmchugh.net

imports:
  - "../sensitive_info.yml"

matches:
  - label: "Facebook (FB) Marketplace: Still Available"
    trigger: ":fbstillavail" 
    form: |
      Hi [[Name]]!
      
      Yup, this item is still available.

      Porch pickup.

      Address is:
      {{address}}
      {{address_url}}

      Let me know when you plan on coming by. Otherwise, I will move onto others who are interested.