# Text expansions related to dates and times.
#
# @author Quinn McHugh
# @website https://quinnmchugh.net

global_vars:
  - name: dateiso 
    type: date
    params:
      format: "%Y-%m-%d"

  - name: time
    type: date
    params:
      format: "%H:%M"

  - name: datetimeiso
    type: date
    params:
      format: "%+"

matches:
  - label: ""
    trigger: ":today"
    replace: "{{dateiso}}"
    
  - label: ""
    trigger: ":datetimeiso"
    replace: "{{datetimeiso}}"
  
  # Useful for writing timestamped meeting notes
  - label: ""
    trigger: ":tm"
    replace: "{{time}} - $|$"
  
  - label: ""
    trigger: ".tm"
    replace: "**{{time}}** - $|$"