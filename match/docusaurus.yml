# Text expansions for adding callouts/admonitions to Zendesk Help Center articles.
#
# Code sourced from Lotus Themes: https://lotusthemes.zendesk.com/hc/en-us/articles/11652596589202-Callout-blocks
#
# @author Quinn McHugh
# @website https://quinnmchugh.net/

matches:
  - label: "Note (Docusaurus)"
    trigger: ":dsaur"
    replace: |
      :::note[]

      $|$
      
      :::

  - label: "Info (Docusaurus)"
    trigger: ":dsaur"
    replace: |
      :::info[]

      $|$
      
      :::

  - label: "Tip (Docusaurus)"
    trigger: ":dsaur"
    replace: |
      :::tip[]

      $|$
      
      :::

  - label: "Warning (Docusaurus)"
    trigger: ":dsaur"
    replace: |
      :::warning[]

      $|$
      
      :::

  - label: "Danger (Docusaurus)"
    trigger: ":dsaur"
    replace: |
      :::danger[]
      $|$
      
      :::

